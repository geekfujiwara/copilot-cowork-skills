name: Validate skills

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit every skill
        shell: bash
        run: |
          set -euo pipefail
          for skill in skills/*; do
            [ -d "$skill" ] || continue
            python -B skills/skill-builder/scripts/audit_skill.py "$skill"
          done
      - name: Build and verify skill ZIPs
        run: |
          python -B skills/skill-builder/scripts/package_skills.py
          python -B skills/skill-builder/scripts/package_skills.py --check
