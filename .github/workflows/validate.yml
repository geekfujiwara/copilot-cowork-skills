name: Validate skills

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test reviewed font allowlist
        run: python -B -m unittest discover -s skills/skill-builder/scripts -p test_audit_skill.py
      - name: Install video test dependencies
        run: python -m pip install Pillow numpy imageio-ffmpeg
      - name: Test video editing and compression
        run: python -B -m unittest discover -s skills/video-editor/scripts -p "test_*.py"
      - name: Audit every skill
        shell: bash
        run: |
          set -euo pipefail
          for skill in skills/*; do
            [ -d "$skill" ] || continue
            python -B skills/skill-builder/scripts/audit_skill.py "$skill"
          done
      - name: Build and verify skill ZIPs
        run: |
          python -B skills/skill-builder/scripts/package_skills.py
          python -B skills/skill-builder/scripts/package_skills.py --check
